name: "officeqa-analyst"
version: "3.0.0"
competition: "grounded-reasoning"

# Architecture: MiniMax-as-Analyst
# MiniMax reviews solve.py output and decides next steps.
# solve.py does all search/extraction. MiniMax reasons about results.
# No panic prompts. No budget screaming. 300s timeout is the real limit.

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "analyst/prompts/system.j2"
  skills_dir: "skills/"

  config:
    max_turns: 20
    temperature: 0.0
    reasoning_effort: "high"

  env:
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    LLM_API_KEY: "${OPENROUTER_API_KEY}"
    CORPUS_DIR: "/app/corpus"
    INDEX_PATH: "/tmp/table_index.jsonl"
    KEYWORD_INDEX_PATH: "/tmp/keyword_index.txt"
    BUILD_SCRIPT: "/installed-agent/build_index.py"
    SOLVE_MODE: "briefing"

environment:
  timeout_per_task: 300
