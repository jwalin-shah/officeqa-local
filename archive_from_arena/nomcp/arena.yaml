name: "officeqa-nomcp"
version: "2.0.0"
competition: "grounded-reasoning"

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "prompts/system.j2"
  skills_dir: "skills/"

  config:
    max_turns: 8
    temperature: 0.0
    reasoning_effort: "high"

  env:
    OPENROUTER_API_KEY: "REDACTED"
    LLM_API_KEY: "REDACTED"
    CORPUS_DIR: "/app/corpus"
    INDEX_PATH: "/tmp/table_index.jsonl"
    KEYWORD_INDEX_PATH: "/tmp/keyword_index.txt"
    BUILD_SCRIPT: "/installed-agent/build_index.py"

environment:
  timeout_per_task: 300
