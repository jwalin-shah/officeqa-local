name: "officeqa-orchestrator"
version: "4.0.0"
competition: "grounded-reasoning"

# Architecture: Orchestrator Pipeline
# solve_v2.py --orchestrator does everything:
#   1. LLM decomposes question into sub-queries
#   2. Grep-based search across 696 Treasury Bulletin files
#   3. 3-strategy extraction with consensus voting
#   4. Orchestrator combines pieces with computation rules
#   5. Writes answer to /app/answer.txt
# MiniMax just calls the solver and verifies the output.

agent:
  type: "harness"
  harness_name: "goose"
  model: "openrouter/minimax/minimax-m2.5"
  prompt_template_path: "nomcp/bottomup/prompts/system.j2"
  skills_dir: "skills/"

  config:
    max_turns: 8
    temperature: 0.0
    reasoning_effort: "high"

  env:
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    LLM_API_KEY: "${OPENROUTER_API_KEY}"
    CORPUS_DIR: "/app/corpus"
    INDEX_PATH: "/tmp/table_index.jsonl"
    KEYWORD_INDEX_PATH: "/tmp/keyword_index.txt"
    BUILD_SCRIPT: "/installed-agent/build_index.py"

environment:
  timeout_per_task: 600
