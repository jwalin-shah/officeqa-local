[project]
name = "officeqa-local"
version = "0.1.0"
description = "OfficeQA Solver - Treasury Bulletin data extraction"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.13.0",
    "instructor>=1.12.0",
    "lxml>=6.0.3",
    "numpy>=2.4.4",
    "openai>=1.0.0,<2.0.0",
    "pandas>=3.0.2",
    "pint>=0.25.3",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.14.5",
    "scipy>=1.17.1",
]

[project.scripts]
officeqa-agent-doctor = "scripts.doctor_agents:main"
officeqa-agent-setup = "scripts.setup_agents:main"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    # Analysis / eval scratch scripts — not production code paths
    "analyze_retrieve_misses.py",
    "eval_agent_fallback.py",
    "eval_agent_full.py",
    "eval_decompose.py",
    "eval_extract_oracle.py",
    "eval_hybrid_oracle.py",
    "eval_retrieve.py",
    "search_agent.py",
    "test_recall_with_decompose.py",
    # Legacy — not part of the active pipeline (see CLAUDE.md)
    "decompose.py",
    "orchestrator.py",
    "agent.py",
    "evaluate.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.bandit]
exclude_dirs = [
    ".venv",
    "tests",
]
# B307 safe eval with restricted builtins in find.py (documented)
# B310 urllib.urlopen on trusted fixed URLs
# B403 pickle for local corpus index
# B608 parameterized SQL using dynamic ? placeholder counts
skips = [
    "B101", "B404", "B110", "B112", "B603", "B607",
    "B307", "B310", "B403", "B608",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]
