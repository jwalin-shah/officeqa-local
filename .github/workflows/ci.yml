# Default branch CI: lint + typecheck + unit tests (no ledger.sqlite).
# Full integration (test_feedback_loop, test_ledger, retrieval+ledger cases) runs locally.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      # Pyright is run locally (`uv run pyright`); the repo still has legacy
      # scripts outside the narrowed type surface. CI stays green on ruff + pytest.

      - name: Pytest (no ledger)
        run: uv run pytest -q --no-cov
